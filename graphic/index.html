:root{
  --graphite:#242423;
  --paper:#ffffff;
  --ink:#2a2a29;
  --grey:#575756;
  --blue:#1d70b7;
  --amber:#ffb74a;
  --cond:"Oswald","Arial Narrow",Arial,sans-serif;
  --gutter:clamp(16px,4vw,48px);
  --gap:clamp(10px,1.4vw,20px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--cond)}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:4px}

.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:10px 32px;padding:clamp(22px,3vw,36px) var(--gutter) clamp(26px,4vw,52px)}
.home{font-weight:300;font-size:18px;letter-spacing:.04em;text-decoration:none;padding:4px 0;border-bottom:1px solid transparent}
.home:hover{border-bottom-color:var(--blue)}
.top h1{margin:0;font-weight:300;font-size:clamp(26px,1.6vw + 16px,34px);letter-spacing:.03em;line-height:1;color:var(--blue)}

/* senza JavaScript: colonne CSS; con JavaScript: colonne costruite in ordine di lettura */
.wall{padding:0 var(--gutter);columns:2;column-gap:var(--gap)}
@media (min-width:1000px){.wall{columns:3}}
@media (min-width:1600px){.wall{columns:4}}
.wall.is-js{display:flex;align-items:flex-start;gap:var(--gap);columns:auto}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:var(--gap)}

.tile{margin:0 0 var(--gap);break-inside:avoid;background:#f2f2f0}
.wall.is-js .tile{margin:0}
.tile img{display:block;width:100%;height:auto;cursor:default;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;
  filter:invert(0);transition:filter .7s ease}
.tile.neg img{filter:invert(1)}
.tile.lampo img{transition:none;animation:lampo 1.2s steps(1,end) forwards}
@keyframes lampo{0%{filter:invert(0)}25%{filter:invert(1)}50%{filter:invert(0)}75%,100%{filter:invert(1)}}
@media (prefers-reduced-motion:reduce){.tile img{transition:none}.tile.lampo img{animation:none}}

.colophon{margin:clamp(56px,8vw,96px) var(--gutter) 0;padding:20px 0 40px;border-top:1px solid #e2e2df;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 32px;font-weight:300;font-size:15px;line-height:1.6;color:var(--grey)}
.colophon p{margin:0}
</style>

<script>
(function(){
  var wall=document.querySelector('.wall'); if(!wall)return;
  var tiles=[].slice.call(wall.querySelectorAll('.tile'));

  /* ---------- colonne adattive, in ordine di lettura (sempre nella colonna più corta) ---------- */
  var cur=0;
  function nCols(){var w=window.innerWidth;return w>=1600?4:w>=1000?3:2;}
  function ratio(t){var i=t.querySelector('img');return (+i.getAttribute('height')||1)/(+i.getAttribute('width')||1);}
  function layout(){
    var n=nCols(); if(n===cur)return; cur=n;
    var old=[].slice.call(wall.querySelectorAll('.col')), cols=[], h=[], k;
    var gap=parseFloat(getComputedStyle(wall).columnGap)||16;
    var colW=Math.max(1,(wall.clientWidth-gap*(n-1))/n), g=gap/colW;
    for(k=0;k<n;k++){var c=document.createElement('div');c.className='col';cols.push(c);h.push(0);}
    tiles.forEach(function(t){var m=0;for(k=1;k<n;k++)if(h[k]<h[m]-1e-3)m=k;cols[m].appendChild(t);h[m]+=ratio(t)+g;});
    old.forEach(function(o){wall.removeChild(o);});
    cols.forEach(function(c){wall.appendChild(c);});
    wall.classList.add('is-js');
  }
  layout();
  var rt; window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,120);});

  /* ---------- negativo/positivo ---------- */
  var mq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
  var pool=tiles.filter(function(t){return t.getAttribute('data-effetto')!=='no';});
  if(!pool.length)return;
  var seen=[];
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){
      var i=seen.indexOf(e.target); if(e.isIntersecting){if(i<0)seen.push(e.target);}else if(i>=0)seen.splice(i,1);
    });},{threshold:.35});
    pool.forEach(function(t){io.observe(t);});
  } else seen=pool.slice();

  var active=0, MAX=2, FADE=700, LAMPO=1200, recent=[];
  function rnd(a,b){return a+Math.random()*(b-a);}
  function back(t,ms){setTimeout(function(){t.classList.remove('neg');setTimeout(function(){active--;},FADE);},ms);}
  function run(t){
    active++;
    var mode=t.getAttribute('data-effetto');
    if(mode!=='lampo'&&mode!=='inversione')mode=Math.random()<.4?'lampo':'inversione';
    var hold=rnd(1600,3200);
    if(mode==='lampo'){
      t.classList.add('lampo');
      setTimeout(function(){t.classList.add('neg');t.classList.remove('lampo');back(t,hold);},LAMPO);
    } else {t.classList.add('neg');back(t,FADE+hold);}
  }
  function tick(){
    if(!(mq&&mq.matches)&&!document.hidden&&active<MAX){
      var c=seen.filter(function(t){return !t.classList.contains('neg')&&!t.classList.contains('lampo');});
      /* evita di ripetere subito le ultime immagini, se ce ne sono altre in vista */
      var fresh=c.filter(function(t){return recent.indexOf(t)<0;}); if(fresh.length)c=fresh;
      if(c.length){var t=c[Math.floor(Math.random()*c.length)];recent.push(t);if(recent.length>3)recent.shift();run(t);}
    }
    setTimeout(tick,rnd(1800,3600));
  }
  setTimeout(tick,1200);
})();
</script>
